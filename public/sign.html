<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign Document</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .doc-frame { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
    .sig-preview { font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive; font-size: 1.9rem; min-height: 2.6rem;
      border-bottom: 1px solid var(--text); padding: 4px 2px; margin: 12px 0 4px; overflow-wrap: anywhere; }
    .signers { list-style: none; padding: 0; margin: 8px 0 0; }
    .signers li { padding: 4px 0; }
    @media (max-width: 700px) { .doc-frame { display: none; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap"><span class="brand-mark"></span><span class="title">TennisDesk</span></div></header>
  <main class="wrap" style="max-width:860px">
    <div class="card hidden" id="error"><h1>Can't open this document</h1><p id="errMsg"></p></div>

    <div id="doc" class="hidden">
      <div class="card">
        <h1 id="title"></h1>
        <p class="muted small" id="sentTo"></p>
        <ul class="signers small" id="signers"></ul>
      </div>

      <div class="card">
        <h2>1. Read the document</h2>
        <iframe class="doc-frame" id="frame" title="The document to sign"></iframe>
        <div class="row" style="margin-top:12px">
          <a class="btn" id="open" target="_blank" rel="noopener">Open the full document</a>
          <a class="btn" id="download">Download a copy</a>
        </div>
      </div>

      <div class="card" id="signCard">
        <h2>2. Sign</h2>
        <div class="notice error hidden" id="formErr"></div>
        <form id="form" novalidate>
          <div class="form-row">
            <div><label for="name">Your full legal name</label><input id="name" name="name" autocomplete="name" maxlength="120" required></div>
            <div><label for="sigTitle">Title <span class="muted small">(optional, e.g. Owner)</span></label><input id="sigTitle" name="title" maxlength="120"></div>
          </div>
          <div class="sig-preview" id="preview" aria-hidden="true"></div>
          <p class="muted small" style="margin-top:0">Your signature</p>
          <label class="check small" style="margin-top:12px"><input type="checkbox" id="consent">
            I have read this document. I agree to sign it electronically, and that typing my name above is my legal signature, just like signing on paper.</label>
          <button class="primary block" type="submit" id="submit" style="margin-top:16px">Sign document</button>
        </form>
      </div>

      <div class="card hidden" id="doneCard">
        <h2 id="doneTitle"></h2>
        <p id="doneMsg"></p>
      </div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/sign.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Operator Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div class="wrap"><span class="brand-mark"></span><span class="title">TennisDesk operator</span>
    <button class="sm hidden" id="logout">Log out</button></div></header>
  <main class="wrap">
    <div id="login" class="narrow hidden">
      <form class="card" id="loginForm" novalidate>
        <h1>Operator login</h1>
        <div class="notice error hidden" id="err"></div>
        <label>Email</label><input name="email" type="email" autocomplete="username">
        <label>Password</label><input name="password" type="password" autocomplete="current-password">
        <button class="primary block" type="submit" style="margin-top:16px">Log in</button>
      </form>
    </div>
    <div id="console" class="hidden">
      <h1>Academies</h1>
      <div class="stats" id="stats"></div>
      <div class="table-wrap"><table id="table"></table></div>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/platform.js"></script>
</body>
</html>

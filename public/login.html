<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div class="wrap"><span class="brand-mark"></span><a class="title" href="/" style="color:inherit;text-decoration:none">CourtDesk</a></div></header>
  <div class="narrow">
    <div class="card">
      <h1>Log in</h1>
      <div id="recentWrap" class="hidden">
        <p class="muted">Choose your academy:</p>
        <div class="list" id="recent"></div>
        <p class="muted small" style="margin-top:20px">Not listed? Get your login link by email:</p>
      </div>
      <p class="muted" id="intro">Enter your email and we'll send you the link to your academy's login page.</p>
      <div class="notice info hidden" id="sent"></div>
      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button class="primary block" type="submit" id="submit" style="margin-top:14px">Email me my login link</button>
      </form>
      <p class="small muted" style="margin-top:16px">Tip: your academy's booking link takes you straight to its log-in page. Bookmark it.</p>
    </div>
    <p class="small muted" style="text-align:center">Run an academy and new here? <a href="/start">Start a free trial</a></p>
  </div>
  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div class="wrap"><span class="brand-mark"></span><a class="title" href="/" style="color:inherit;text-decoration:none">CourtDesk</a></div></header>
  <div class="narrow">
    <div class="card">
      <h1>Log in</h1>
      <div id="recentWrap" class="hidden">
        <p class="muted">Continue to:</p>
        <div class="list" id="recent"></div>
        <p class="muted small" style="margin-top:16px">Or find another academy:</p>
      </div>
      <p class="muted" id="intro">Which academy do you take lessons with or run?</p>
      <label for="q">Academy name</label>
      <input id="q" type="search" autocomplete="off" placeholder="e.g. Total Tennis">
      <div class="list" id="results" style="margin-top:12px" aria-live="polite"></div>
      <p class="small muted" style="margin-top:16px">Your academy's booking link also takes you straight to its log-in page.</p>
    </div>
    <p class="small muted" style="text-align:center">Run an academy and new here? <a href="/start">Start a free trial</a></p>
  </div>
  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
